name: Deploy

on:
  push:
    branches: [main]

# Requires the following GitHub secrets to be set on the repository:
#   SSH_PRIVATE_KEY   — private key whose public key is in ~/.ssh/authorized_keys on the server
#   SERVER_HOST       — server IP or hostname
#   SERVER_USER       — SSH username (e.g. ubuntu)
#   SERVER_DEPLOY_PATH — absolute path on server where the repo is checked out (e.g. /opt/expense-service)

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: []   # uncomment: [backend-lint-build, frontend-lint-build] to gate on CI passing
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_DEPLOY_PATH }}

            echo "→ Pulling latest changes"
            git pull origin main

            echo "→ Rebuilding and restarting containers"
            docker-compose up --build -d

            echo "→ Removing unused images"
            docker image prune -f

            echo "✓ Deploy complete"
